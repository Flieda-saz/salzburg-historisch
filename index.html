<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historisches Salzburg</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css">

<style>
html, body, #map { height: 100%; margin: 0; }

.control {
    position: absolute;
    bottom: 25px;
    left: 15px;
    z-index: 1000;
    background: white;
    padding: 12px;
    border-radius: 8px;
    box-shadow: 0 2px 8px #777;
    font-family: sans-serif;
}
</style>
</head>

<body>
<div id="map"></div>

<div class="control">
    <strong>Historischer Flächenwidmungsplan Salzburg</strong><br>
    Deckkraft:
    <input type="range" id="opacity" min="0" max="100" value="70">
    <strong><span id="opacity-value">70</span> %</strong><br>
    <small>Empfohlene Einstellung: 70 %</small>
    <div id="labels-section" style="display:none">
        <hr>
        <strong>Straßen- und Ortsnamen</strong><br>
        Deckkraft:
        <input type="range" id="labels-opacity" min="0" max="100" value="80">
        <strong><span id="labels-value">80</span> %</strong>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>

<script>
const map = L.map('map').setView([47.802, 13.042], 13);

const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const esri = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        maxZoom: 19,
        maxNativeZoom: 19,
        attribution: 'Imagery &copy; Esri and its imagery providers'
    }
);

const historic = L.tileLayer('tiles/{z}/{x}/{y}.png', {
    minZoom: 10,
    maxNativeZoom: 17,
    maxZoom: 19,
    opacity: 0.7,
    attribution: 'Historischer Flächenwidmungsplan Salzburg'
}).addTo(map);

const labels = L.maplibreGL({
    style: 'street_labels.json',
    interactive: false,
    attribution: 'Straßenbeschriftungen: Esri'
});

// MapLibre-Beschriftungen über Luftbild und historische Karte legen
labels.on('add', function() {
    labels.getContainer().style.zIndex = '1000';
});
L.control.layers(
    {
        'OpenStreetMap': osm,
        'Esri World Imagery': esri
    },
    {
        'Historical Salzburg map': historic
    },
    { collapsed: false }
).addTo(map);

const opacitySlider = document.getElementById('opacity');
const opacityValue = document.getElementById('opacity-value');
const recommendation = document.querySelector('.control small');

function setOpacity(value) {
    historic.setOpacity(value / 100);
    opacitySlider.value = value;
    opacityValue.textContent = value;
}

setOpacity(52);
recommendation.textContent = 'Empfohlene Einstellung: 52 % (OpenStreetMap)';

opacitySlider.addEventListener('input', function() {
    setOpacity(Number(this.value));
});

document.getElementById('labels-opacity').addEventListener('input', function() {
    labels.getContainer().style.opacity = this.value / 100;
    document.getElementById('labels-value').textContent = this.value;
});

const labelsSection = document.getElementById('labels-section');

function updateLabelsVisibility(show) {
    labelsSection.style.display = show ? 'block' : 'none';

    if (show) {
        labels.addTo(map);
        const container = labels.getContainer();
        if (container) {
            container.style.opacity =
                document.getElementById('labels-opacity').value / 100;
        }
    } else {
        map.removeLayer(labels);
    }
}

updateLabelsVisibility(false);

map.on('baselayerchange', function(event) {
    updateLabelsVisibility(event.layer === esri);
    if (event.layer === esri) {
        setOpacity(42);
        recommendation.textContent = 'Empfohlene Einstellung: 42 % (Esri)';
    } else if (event.layer === osm) {
        setOpacity(52);
        recommendation.textContent = 'Empfohlene Einstellung: 52 % (OpenStreetMap)';
    }
});
</script>
</body>
</html>
